<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark' : true;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Restores the real path encoded by 404.html before react-router mounts.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
    />
    <!--
      title/description/canonical/og/twitter tags are intentionally NOT
      hardcoded here anymore - every route sets its own via the <Seo>
      component (src/components/Seo.tsx) through react-helmet-async.
      Helmet only dedupes tags it renders itself; a static duplicate left
      here would coexist with the per-route one once JS runs, giving
      crawlers two conflicting canonical/description tags per page.
    -->
    <meta name="author" content="Ganesh Murali" />
    <meta name="keywords" content="frontend developer, react native developer, mobile app developer, ui ux designer, react developer, web developer, photographer, integration developer, portfolio" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
